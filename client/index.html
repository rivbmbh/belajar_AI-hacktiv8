<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini AI Chatbot - EduTech</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-info">
        <div class="avatar-header">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="header-text">
          <h2>Gemini AI Assistant</h2>
          <span class="status"><span class="status-dot"></span> Online</span>
        </div>
      </div>
      <button id="clear-btn" class="clear-btn" title="Hapus Riwayat Chat">
        <i class="fa-solid fa-trash-can"></i>
        <span>Hapus Chat</span>
      </button>
    </header>

    <div id="chat-box" class="chat-box">
      <!-- Chat messages will be loaded dynamically -->
    </div>

    <form id="chat-form" class="chat-input-form">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ketik pesan Anda di sini..." 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="send-btn">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Kirim</span>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
